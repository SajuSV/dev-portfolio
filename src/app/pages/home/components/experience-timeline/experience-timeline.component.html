<section class="section section_mt section-experience">
  <header class="section-header container" data-os-animation appOsAnimation>
    <div class="row">
      <div class="col">
        <div class="section-header__label">
          <div class="section-header__square"></div><span>Learned &amp; Earned</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <h2>From classrooms to client projects — here’s how I got here.</h2>
      </div>
    </div>
  </header>
  <div class="container-fluid">
    <div class="section-experience__wrapper-item" *ngFor="let entry of entries">
      <a class="figure-experience" data-os-animation appOsAnimation>
        <img
          class="figure-experience__wrapper-img of-cover"
          [src]="entry.image"
          width="1920"
          height="960"
          loading="lazy"
          alt=""
        />
        <div class="container">
          <div class="row align-items-center">
            <div class="col-lg-2">
              <time class="figure-experience__date" [attr.datetime]="entry.datetime">{{ entry.date }}</time>
            </div>
            <div class="col-lg-10">
              <div class="figure-experience__content">
                <h3>{{ entry.title }}</h3>
              </div>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
