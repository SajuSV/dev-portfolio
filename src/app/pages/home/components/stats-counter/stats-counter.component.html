<div class="container py-5 text-white counter">
  <div class="row justify-content-center text-center" style="margin: 0;">
    <div class="col-md-3 col" *ngFor="let stat of stats">
      <span
        class="display-4"
        appCounterUp
        [countFrom]="stat.from"
        [countTo]="stat.to"
        [countDuration]="stat.duration"
        [countSuffix]="stat.suffix"
      ></span>
      <div class="figure-info__option">{{ stat.label }}</div>
    </div>
  </div>
</div>
