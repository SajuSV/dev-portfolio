<article class="portfolio-details bg-light">
  <app-portfolio-masthead pageTitle="Web Development" tag="Html | CSS | JS | WordPress | Angular"></app-portfolio-masthead>

  <div class="container-fluid">
    <div class="row text-center">
      <div class="col">
        <img class="img-fullwidth" [src]="heroImage" width="1760" height="1173" loading="lazy" alt="" />
      </div>
    </div>

    <app-portfolio-options [options]="options"></app-portfolio-options>
    <app-portfolio-quote [text]="quote"></app-portfolio-quote>
  </div>

  <app-client-logos></app-client-logos>

  <app-portfolio-next-link nextPath="/webdesign" nextTitle="Web Design"></app-portfolio-next-link>
</article>
