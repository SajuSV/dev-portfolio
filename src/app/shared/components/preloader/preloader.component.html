<div class="preloader" #preloaderEl>
  <div class="preloader__curtain" [ngClass]="curtainClass" #curtainEl></div>
  <div class="preloader__wrapper-logo">
    <div class="preloader__logo" #logoEl>
      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <g fill="none" fill-rule="evenodd">
          <rect class="rect" width="100%" height="100%" #rectEl></rect>
        </g>
      </svg>
      <div class="logo">
        <div class="logo__text">{{ logoText }}</div>
      </div>
    </div>
  </div>
</div>
